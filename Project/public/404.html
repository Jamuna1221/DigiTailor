<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DigiTailor</title>
</head>
<body>
  <script>
    (function () {
      try {
        var p = window.location.pathname;
        // Only save real SPA routes (ignore missing assets like /img.png)
        if (!/\.[a-zA-Z0-9]{2,}$/.test(p)) {
          sessionStorage.setItem('spa_redirect', p + window.location.search);
        }
      } catch (e) {}
      window.location.replace('/');
    })();
  </script>
</body>
</html>
